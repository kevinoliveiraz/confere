<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#194f43">
  <meta name="description" content="Confira o estoque físico com o sistema, um item de cada vez.">
  <title>Confere — Contagem de estoque</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23194f43'/%3E%3Cpath d='m11 21 6 6 13-14' fill='none' stroke='%23d8efa9' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a href="#app" class="skip-link">Pular para o conteúdo</a>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="Confere, início"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></span>confere<span class="brand-dot">.</span></a>
      <nav aria-label="Principal"><button id="nav-counts" class="nav active">Contagens</button><button id="nav-history" class="nav">Histórico</button></nav>
      <div class="header-end"><span class="local-label"><span></span>Seu estoque, sob controle</span><button id="theme-toggle" class="theme-toggle" type="button" aria-label="Ativar modo escuro" aria-pressed="false" title="Ativar modo escuro"><svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13.1A8.5 8.5 0 0 1 10.9 3.5a8.5 8.5 0 1 0 9.6 9.6Z"/></svg><svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button id="help" class="help" aria-label="Sobre o armazenamento e como usar">?</button></div>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <dialog id="new-dialog" aria-labelledby="dialog-title">
    <form id="new-form">
      <div class="dialog-icon" aria-hidden="true">＋</div><span class="eyebrow">VAMOS COMEÇAR</span><h2 id="dialog-title">Nova contagem</h2>
      <p>Dê um nome para encontrar esta conferência depois.</p>
      <label>Nome da contagem<input name="name" required maxlength="100" placeholder="Ex.: Estoque da loja" autocomplete="off" autofocus></label>
      <label>Data da contagem<input name="date" type="date" required></label>
      <div class="dialog-actions"><button type="button" id="cancel-new" class="button">Cancelar</button><button class="button primary">Começar contagem <span aria-hidden="true">→</span></button></div>
    </form>
  </dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
